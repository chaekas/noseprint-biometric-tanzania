services:
  db:
    image: pgvector/pgvector:pg17
    container_name: noseprint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: noseprint
      POSTGRES_USER: noseprint
      POSTGRES_PASSWORD: noseprint_dev_password
    ports:
      - "5433:5432"
    volumes:
      - noseprint_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noseprint -d noseprint"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  noseprint_pgdata:
